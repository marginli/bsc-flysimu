<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 530" role="img" aria-labelledby="lifTitle" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI','Microsoft JhengHei',sans-serif" width="900" height="530"><rect width="100%" height="100%" fill="#fff"></rect>
<title id="lifTitle">漏電整合發放示意：左邊水桶的水位是膜電位 V，水龍頭開度是 g，桶底的洞是漏電；右邊是上游輸入、g、V 與輸出放電隨時間的變化</title>
<defs>
  <clipPath id="lifBucket"><rect x="63" y="80" width="154" height="387"></rect></clipPath>
  <clipPath id="lifTr"><rect x="368" y="0" width="516" height="530"></rect></clipPath>
  <marker id="lifArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"></path></marker>
</defs>
<text x="20" y="24" font-size="15" font-weight="700" fill="#1b2733">水桶比喻</text>
<!-- 上游與水管：上游放電後訊號沿管子走 1.8 ms 才到水龍頭 -->
<circle cx="30" cy="62" r="11" fill="#fff" stroke="#2563eb" stroke-width="2"></circle><text x="30" y="66" font-size="11" text-anchor="middle" fill="#2563eb">興</text>
<circle cx="30" cy="96" r="11" fill="#fff" stroke="#9333ea" stroke-width="2"></circle><text x="30" y="100" font-size="11" text-anchor="middle" fill="#9333ea">抑</text>
<path d="M41 62 H70 V78 H150 M41 96 H70 V78" fill="none" stroke="#8b98a5" stroke-width="6" stroke-linejoin="round" stroke-opacity=".45"></path>
<text x="74" y="97" font-size="10" fill="#5a6b7b">沿管子走 1.8 ms</text>
<rect x="148" y="66" width="34" height="24" rx="5" fill="#cbd5e1" stroke="#5a6b7b"></rect>
<rect x="158" y="90" width="14" height="12" fill="#cbd5e1" stroke="#5a6b7b"></rect>
<g class="lif-handle" transform="rotate(40 165 66)"><rect x="162" y="52" width="6" height="14" fill="#5a6b7b"></rect><rect x="150" y="47" width="30" height="6" rx="3" fill="#5a6b7b"></rect></g>
<g class="lif-travel"></g>
<text class="lif-gtxt" x="190" y="74" font-size="12" fill="#1b2733">g = 60.50 mV</text>
<text x="190" y="90" font-size="11" fill="#5a6b7b">水龍頭開度 g</text>
<!-- 水 -->
<g clip-path="url(#lifBucket)"><rect class="lif-stream" x="158" y="102" width="14" height="236" fill="#7cb6f0"></rect>
<rect class="lif-water" x="60" y="338" width="160" height="132" fill="#7cb6f0" fill-opacity=".85"></rect>
<g class="lif-suck"></g></g>
<path d="M60 134 V470 H134.0 M146.0 470 H220 V134" fill="none" stroke="#1b2733" stroke-width="3" class="lif-wall"></path>
<line x1="60" x2="224" y1="222.5" y2="222.5" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"></line>
<text x="228" y="220.5" font-size="12" fill="#dc2626">刻度 V<tspan font-size="9" dy="3">th</tspan><tspan dy="-3"> −45</tspan></text>
<line x1="60" x2="224" y1="338.0" y2="338.0" stroke="#5a6b7b" stroke-width="1.5" stroke-dasharray="3 3"></line>
<text x="228" y="342.0" font-size="12" fill="#5a6b7b">V<tspan font-size="9" dy="3">rest</tspan><tspan dy="-3"> −52</tspan></text>
<text x="228" y="144" font-size="11" fill="#8b98a5">−40</text>
<text x="228" y="474" font-size="11" fill="#8b98a5">−60 mV</text>
<text class="lif-vtxt" x="66" y="462" font-size="12" font-weight="600" fill="#1b2733">水位 V = −52.00 mV</text>
<g class="lif-drips"></g>
<text x="140.0" y="516" font-size="11" text-anchor="middle" fill="#5a6b7b">桶底的洞（漏電）：水位往 V<tspan font-size="8" dy="3">rest</tspan><tspan dy="-3"> 拉</tspan></text>

<g class="lif-fire" opacity="1"><text x="140.0" y="130" font-size="18" font-weight="800" text-anchor="middle" fill="#ea580c">放電！</text>
<line x1="222" y1="190" x2="280" y2="190" stroke="#ea580c" stroke-width="3" marker-end="url(#lifArr)"></line>
<text x="228" y="184" font-size="11" fill="#ea580c">送給下游</text></g>
<g class="lif-rfc" opacity="1"><rect x="63" y="140" width="154" height="330" fill="#94a3b8" fill-opacity=".35"></rect>
<text x="140.0" y="170" font-size="13" font-weight="700" text-anchor="middle" fill="#1b2733">不反應期</text>
<text x="140.0" y="188" font-size="11" text-anchor="middle" fill="#1b2733">2.2 ms 內兩式暫停</text>
<rect class="lif-rfcbar" x="90" y="196" width="45.45454545454545" height="5" fill="#1b2733"></rect></g>
<!-- 右邊：軌跡 -->
<line x1="338" x2="338" y1="20" y2="510" stroke="#e4e8ee"></line>
<text x="368" y="38" font-size="12" fill="#5a6b7b">上游送出的放電（<tspan fill="#2563eb">↑ 興奮</tspan>、<tspan fill="#9333ea">↓ 抑制</tspan>，數字＝同一刻幾個）</text>
<line x1="368" x2="884" y1="58.0" y2="58.0" stroke="#e4e8ee"></line>
