<title id="lifTitle">漏電整合發放示意：左邊水桶的水位是膜電位 V，水龍頭開度是 g，桶底的洞是漏電；右邊是上游輸入、g、V 與輸出放電隨時間的變化</title>
<defs>
  <clipPath id="lifBucket"><rect x="63" y="80" width="154" height="387"></rect></clipPath>
  <clipPath id="lifTr"><rect x="368" y="0" width="516" height="530"></rect></clipPath>
